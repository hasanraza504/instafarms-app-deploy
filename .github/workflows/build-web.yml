# Web build — free public-repo runner; produces a static Expo web export.
#
# The app source lives in a PRIVATE repo. It is cloned into the runner with a
# READ-ONLY deploy key, exported, and destroyed with the runner. Nothing from it
# is committed here and nothing is uploaded as an Actions artifact (those are
# public on a public repo). The tarball goes to private R2 storage:
#   builds:<app>/web/<profile>/<full-sha>.tar.gz  (+ .sha256)
# koha-dev's v4 deploy (preprod branch -> v4 site) downloads it from there.
#
# EXPO_PUBLIC_* values come from the app's eas.json build profile (following
# "extends"), so web and the mobile build of the same profile hit the same API.

name: Build Web
run-name: "Build Web · ${{ inputs.profile }} · ${{ inputs.ref }} · ${{ inputs.correlation || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch/tag/SHA to build"
        default: preprod
      profile:
        description: "eas.json build profile whose env is baked in"
        default: preprod
      correlation:
        description: "Correlation id (set by koha-dev deploy; leave blank by hand)"
        default: ""

permissions:
  contents: read

concurrency:
  group: web-${{ inputs.profile }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  SRC: src

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out app source (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          path: ${{ env.SRC }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.SRC }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.SRC }}
        run: npm ci --no-audit --no-fund

      - name: Load EXPO_PUBLIC env from the eas.json profile
        working-directory: ${{ env.SRC }}
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          node -e '
            const b = require("./eas.json").build, seen = new Set();
            const resolve = n => { if (!b[n]) throw new Error("no eas.json profile " + n);
              if (seen.has(n)) throw new Error("extends loop at " + n); seen.add(n);
              const p = b[n]; return { ...(p.extends ? resolve(p.extends) : {}), ...(p.env || {}) }; };
            const env = resolve(process.env.PROFILE);
            for (const [k, v] of Object.entries(env)) if (k.startsWith("EXPO_PUBLIC_")) console.log(k + "=" + v);
          ' > "$RUNNER_TEMP/profile.env"
          cat "$RUNNER_TEMP/profile.env" >> "$GITHUB_ENV"
          cut -d= -f1 "$RUNNER_TEMP/profile.env" | tr '\n' ' '; echo
          grep '^EXPO_PUBLIC_API_URL=' "$RUNNER_TEMP/profile.env"

      - name: Export static web build
        working-directory: ${{ env.SRC }}
        env:
          CI: "1"
        run: |
          npx expo export -p web --output-dir "$RUNNER_TEMP/web"
          test -f "$RUNNER_TEMP/web/index.html"

      - name: Upload to private artifact storage
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG_ONEDRIVE }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          : "${RCLONE_CONF:?RCLONE_CONFIG_ONEDRIVE is unset}"
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          app="${GITHUB_REPOSITORY##*/}"; app="${app%-deploy}"
          sha="$(git -C "$SRC" rev-parse HEAD)"
          name="${sha}.tar.gz"
          tar -C "$RUNNER_TEMP/web" -czf "$RUNNER_TEMP/$name" .
          ( cd "$RUNNER_TEMP" && sha256sum "$name" > "$name.sha256" && ls -lh "$name" )
          conf="$RUNNER_TEMP/rclone.conf"; printf '%s' "$RCLONE_CONF" > "$conf"; chmod 600 "$conf"
          dest="builds:${app}/web/${PROFILE}"
          rclone --config "$conf" copyto "$RUNNER_TEMP/$name" "$dest/$name" --no-traverse
          rclone --config "$conf" copyto "$RUNNER_TEMP/$name.sha256" "$dest/$name.sha256" --no-traverse
          rm -f "$conf"
          echo "### Web build uploaded: \`${app}/web/${PROFILE}/${name}\`" >> "$GITHUB_STEP_SUMMARY"
